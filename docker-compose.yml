services:
  tarsel-mail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarsel-mail
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - OLLAMA_MODELS=/data/ollama
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_AUTO_PULL=${OLLAMA_AUTO_PULL:-true}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - AI_PROVIDER=ollama
      - AI_BASE_URL=${AI_BASE_URL:-http://127.0.0.1:11434/v1}
      - AI_MODEL=${AI_MODEL:-qwen2.5:3b}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - tarsel_data:/data

volumes:
  tarsel_data:
